services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: moneymap
      POSTGRES_USER: moneymap
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - moneymap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneymap -d moneymap"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  moneymap_pgdata:
